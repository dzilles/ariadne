[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-harness"
version = "0.2.0"
description = "Ariadne: a modular, headless LLM harness prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ariadne = "ariadne.cli:main"

[tool.setuptools.packages.find]
include = ["ariadne*"]

[tool.setuptools.package-data]
"ariadne.task" = ["schema.sql", "tools.json"]
"ariadne.configuration" = ["tools.json"]
